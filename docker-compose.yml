version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U harness" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ────────────────────────────────────────────────────────────────
  # Used by harness.tools.gcn_db (GCN CRUD + full-text search).
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── harness API ────────────────────────────────────────────────────────────
  harness-api:
    build: .
    restart: unless-stopped
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      USE_POSTGRES: "true"
      POSTGRES_DSN: postgresql://harness:harness@postgres:5432/harness
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-harness}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  # ── Telegram bot (channel adapter — Milestone 1) ─────────────────────────
  # Reuses the same image as harness-api but runs a different entrypoint.
  # Comment out (or omit TELEGRAM_BOT_TOKEN) to skip the Telegram channel.
  telegram-bot:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "channels.telegram.bot"]
    env_file:
      - .env
    environment:
      AGENT_API_URL: http://harness-api:8000
    depends_on:
      harness-api:
        condition: service_healthy

  # ── agent-chat-ui (optional demo UI — comment out for prod) ───────────────
  # agent-chat-ui:
  #   image: langchain/agent-chat-ui:latest
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://harness-api:8000
  #   depends_on:
  #     - harness-api

volumes:
  postgres_data:
  mongo_data:
