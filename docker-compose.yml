version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── harness API ────────────────────────────────────────────────────────────
  harness-api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      USE_POSTGRES: "true"
      POSTGRES_DSN: postgresql://harness:harness@postgres:5432/harness
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://192.168.120.11:2900/v1}
      VLLM_MODEL_NAME: ${VLLM_MODEL_NAME:-cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── agent-chat-ui (optional demo UI — comment out for prod) ───────────────
  # agent-chat-ui:
  #   image: langchain/agent-chat-ui:latest
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://harness-api:8000
  #   depends_on:
  #     - harness-api

volumes:
  postgres_data:
