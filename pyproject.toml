[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-playground"
version = "0.1.0"
description = "Production-shaped agent harness on top of deepagents + LangGraph, talking to a local vLLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "harness-playground" }]

dependencies = [
    # Agent core
    "deepagents",
    "langchain-openai",
    "langgraph",

    # Persistence
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "psycopg-pool",
    "pymongo",  # sync driver — harness.persistence.mongo / tools.ttcp_db /
                # extention_/ttcp_batch. Sync (not motor) because @tool functions
                # are sync and run_async()'s per-call event loop breaks Motor's
                # cached client.

    # Dev server (langgraph dev)
    "langgraph-cli[inmem]",

    # API server (T1.4)
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "python-multipart",
    "httpx",

    # Multimodal (T1.5)
    "pdf2image",
    "pillow",

    # Offline batch (extention_/ttcp_batch) — MinIO listing + download + progress bar.
    "boto3",
    "tqdm",

    # Channel adapters (channels/telegram, channels/discord) — kept here even
    # though the bots run as separate processes, so a single `pip install -e .`
    # bootstraps everything for dev.
    "python-telegram-bot>=22.6,<23",

    # Eval / configs
    "pyyaml",
    "pydantic",
    "pydantic-settings",

    # Logging
    "python-json-logger",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ipython",
]

[project.scripts]
harness = "main:main"

[tool.setuptools.packages.find]
# Keep this list in sync with top-level packages — anything that needs to be
# importable after `pip install -e .` must appear here (or match a glob).
# `src*` covers src.extentions.multimodal (used by harness.tools.vision and
# the offline ttcp_batch). `channels*` covers the Telegram/Discord adapters.
include = ["harness*", "src*", "channels*"]
exclude = ["tests*", "evals*", "skills*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
