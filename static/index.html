<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harness Playground</title>
<style>
:root {
  --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
  --border: #475569; --text: #e2e8f0; --muted: #94a3b8;
  --primary: #3b82f6; --primary-d: #2563eb;
  --success: #10b981; --warn: #f59e0b; --error: #ef4444; --purple: #8b5cf6;
  --r: 8px; --font: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono: 'JetBrains Mono','Fira Code',monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text);
       height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ─── Header ─────────────────────────────────────────────────────── */
.header { display: flex; align-items: center; gap: 12px; padding: 0 16px;
          height: 52px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.header-title { font-size: 15px; font-weight: 700; }
.header-sub { font-size: 11px; color: var(--muted); }
.spacer { flex: 1; }
.health-badge { display: flex; align-items: center; gap: 6px; font-size: 12px;
                padding: 4px 10px; border-radius: 20px; background: var(--bg3); cursor: pointer; }
.health-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .3s; }
.health-dot.ok { background: var(--success); }
.health-dot.err { background: var(--error); }

/* ─── Layout ─────────────────────────────────────────────────────── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ─── Sidebar ────────────────────────────────────────────────────── */
.sidebar { width: 260px; background: var(--bg2); border-right: 1px solid var(--border);
           display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
.sb-section { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.sb-label { font-size: 10px; font-weight: 700; color: var(--muted);
            text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.input-sm { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r);
            color: var(--text); padding: 6px 10px; font-size: 13px; font-family: var(--font); width: 100%; }
.input-sm:focus { outline: none; border-color: var(--primary); }
.row { display: flex; gap: 6px; align-items: center; }
.btn { background: var(--primary); color: #fff; border: none; border-radius: var(--r);
       padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: background .15s; }
.btn:hover { background: var(--primary-d); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-sm { padding: 4px 8px; font-size: 12px; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg3); color: var(--text); }
.btn-red { background: var(--error); }
.btn-red:hover { background: #dc2626; }
.sessions-list { flex: 1; overflow-y: auto; padding: 6px; }
.sess-item { display: flex; align-items: center; gap: 6px; padding: 7px 9px;
             border-radius: var(--r); cursor: pointer; transition: background .1s; }
.sess-item:hover { background: var(--bg3); }
.sess-item.active { background: var(--primary); }
.sess-item.active .sess-name { color: #fff; }
.sess-name { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-del { opacity: 0; background: none; border: none; color: var(--error); cursor: pointer;
            font-size: 13px; padding: 0 2px; transition: opacity .1s; flex-shrink: 0; }
.sess-item:hover .sess-del { opacity: 1; }
.sess-item.active .sess-del { opacity: .8; color: #fff; }
.cmd-ref { font-size: 12px; color: var(--muted); line-height: 1.7; }
.cmd-ref span { font-family: var(--mono); color: var(--primary); }

/* ─── Content ────────────────────────────────────────────────────── */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab { padding: 10px 18px; font-size: 13px; cursor: pointer; color: var(--muted);
       border-bottom: 2px solid transparent; transition: all .15s; user-select: none; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.sess-label { display: flex; align-items: center; padding: 0 14px; font-size: 11px; color: var(--muted); margin-left: auto; }

/* ─── Chat panel ─────────────────────────────────────────────────── */
.chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

/* bubbles */
.msg { max-width: 82%; animation: fadeIn .2s ease; }
.msg-user { align-self: flex-end; }
.msg-ai   { align-self: flex-start; }
.msg-center { align-self: center; max-width: 100%; }
.msg-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; padding: 0 2px; }
.bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-word; }
.msg-user .bubble { background: var(--primary); color: #fff; border-radius: 12px 12px 4px 12px; }
.msg-ai  .bubble  { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px 12px 12px 12px; }

/* tool blocks */
.tool-block { background: var(--bg2); border: 1px solid var(--purple);
              border-radius: var(--r); padding: 9px 12px; max-width: 88%;
              align-self: flex-start; animation: fadeIn .2s ease; }
.tool-block.result-block { border-color: var(--success); }
.tb-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 700; font-family: var(--mono); }
.badge-call   { background: rgba(139,92,246,.2); color: var(--purple); }
.badge-result { background: rgba(16,185,129,.15); color: var(--success); }
.tool-name { font-size: 12px; font-family: var(--mono); font-weight: 700; }
.tool-content { font-size: 11px; font-family: var(--mono); color: var(--muted);
                background: var(--bg); border-radius: 5px; padding: 7px; max-height: 180px;
                overflow: auto; white-space: pre-wrap; word-break: break-all; }

/* interrupt */
.intr-block { background: var(--bg2); border: 2px solid var(--warn); border-radius: var(--r);
              padding: 14px 16px; width: 95%; align-self: center; animation: fadeIn .2s ease; }
.intr-title { font-size: 13px; font-weight: 700; color: var(--warn); margin-bottom: 8px; }
.intr-detail { font-size: 11px; font-family: var(--mono); color: var(--muted);
               background: var(--bg); border-radius: 5px; padding: 8px; margin-bottom: 10px;
               white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: auto; }
.intr-actions { display: flex; gap: 8px; }

/* done / error */
.done-pill { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px;
             padding: 4px 12px; background: var(--bg2); border-radius: 20px;
             border: 1px solid var(--border); align-self: center; }
.err-block { align-self: stretch; background: rgba(239,68,68,.1); border: 1px solid var(--error);
             border-radius: var(--r); padding: 9px 13px; font-size: 13px; color: var(--error);
             animation: fadeIn .2s ease; }

/* typing */
.typing { display: flex; gap: 4px; align-self: flex-start; padding: 11px 15px;
          background: var(--bg2); border: 1px solid var(--border);
          border-radius: 4px 12px 12px 12px; animation: fadeIn .2s ease; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,80%,100% { transform:translateY(0); opacity:.5; } 40% { transform:translateY(-6px); opacity:1; } }

/* input area */
.input-area { padding: 10px 14px; background: var(--bg2); border-top: 1px solid var(--border); position: relative; }
.autocomplete { position: absolute; bottom: 100%; left: 14px; right: 14px; background: var(--bg3);
                border: 1px solid var(--border); border-radius: var(--r); display: none; z-index: 10;
                max-height: 200px; overflow-y: auto; }
.autocomplete.show { display: block; }
.ac-item { padding: 7px 11px; cursor: pointer; font-size: 13px; display: flex; align-items: center;
           gap: 10px; transition: background .1s; }
.ac-item:hover, .ac-item.sel { background: var(--primary); color: #fff; }
.ac-cmd  { font-family: var(--mono); font-weight: 700; min-width: 100px; }
.ac-desc { font-size: 12px; color: var(--muted); }
.ac-item:hover .ac-desc, .ac-item.sel .ac-desc { color: rgba(255,255,255,.75); }
.chat-input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r);
              color: var(--text); padding: 10px 13px; font-size: 14px; font-family: var(--font);
              resize: none; max-height: 130px; min-height: 44px; line-height: 1.5; }
.chat-input:focus { outline: none; border-color: var(--primary); }
.send-btn { height: 44px; width: 44px; padding: 0; display: flex; align-items: center;
            justify-content: center; font-size: 17px; flex-shrink: 0; }

/* ─── Pipeline panel ─────────────────────────────────────────────── */
.pipe-panel { flex: 1; overflow-y: auto; padding: 18px; display: none; flex-direction: column; gap: 14px; }
.pipe-panel.show { display: flex; }
.pipe-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
.pipe-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
.pipe-desc  { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.form-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
.form-area  { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r);
              color: var(--text); padding: 9px 12px; font-size: 13px; font-family: var(--font);
              resize: vertical; min-height: 90px; margin-bottom: 10px; }
.form-area:focus { outline: none; border-color: var(--primary); }
.pipe-result { margin-top: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r);
               padding: 11px; font-family: var(--mono); font-size: 11px; white-space: pre-wrap;
               word-break: break-all; max-height: 380px; overflow: auto; display: none; }
.pipe-result.show { display: block; }

/* ─── Markdown ───────────────────────────────────────────────────── */
.md p { margin-bottom: .4em; } .md p:last-child { margin-bottom: 0; }
.md code { background: var(--bg3); padding: 2px 5px; border-radius: 4px; font-family: var(--mono); font-size: .88em; }
.md pre { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
          padding: 10px; overflow-x: auto; margin: 5px 0; }
.md pre code { background: none; padding: 0; }
.md ul, .md ol { padding-left: 1.4em; margin: 3px 0; }
.md strong { color: var(--text); }

/* ─── Scrollbar ──────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border); }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div>
    <div class="header-title">🤖 Harness Playground</div>
    <div class="header-sub">LangGraph · deepagents · vLLM</div>
  </div>
  <div class="spacer"></div>
  <div class="health-badge" onclick="loadHealth()" title="Click to refresh">
    <div class="health-dot" id="healthDot"></div>
    <span id="healthTxt">Checking…</span>
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Settings -->
    <div class="sb-section">
      <div class="sb-label">Settings</div>
      <div style="margin-bottom:7px;">
        <label class="form-label" style="margin-bottom:3px;">API Base URL</label>
        <input class="input-sm" id="apiBase" placeholder="http://localhost:8000">
      </div>
      <label class="form-label" style="margin-bottom:3px;">User ID</label>
      <div class="row">
        <input class="input-sm" id="userId" value="alice" style="flex:1;">
        <button class="btn btn-sm" onclick="applySettings()">Apply</button>
      </div>
    </div>

    <!-- Sessions -->
    <div class="sb-section">
      <div class="sb-label">Sessions</div>
      <div class="row" style="margin-bottom:0;">
        <input class="input-sm" id="newSess" placeholder="session name" value="main" style="flex:1;">
        <button class="btn btn-sm" onclick="createSession()">+ New</button>
      </div>
    </div>
    <div class="sessions-list" id="sessionsList">
      <div style="text-align:center;color:var(--muted);font-size:12px;padding:14px;">Apply settings to load</div>
    </div>

    <!-- Commands reference -->
    <div class="sb-section" style="border-top:1px solid var(--border);border-bottom:none;flex-shrink:0;">
      <div class="sb-label">Slash Commands</div>
      <div class="cmd-ref" id="cmdRef"><div style="color:var(--muted);">Loading…</div></div>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" id="tabChat" onclick="switchTab('chat')">💬 Chat</div>
      <div class="tab" id="tabPipe" onclick="switchTab('pipe')">⚡ Pipelines</div>
      <div class="sess-label" id="sessLabel">—</div>
    </div>

    <!-- Chat panel -->
    <div class="chat-panel" id="chatPanel">
      <div class="messages" id="messages">
        <div style="text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;">
          Select or create a session to start chatting.
        </div>
      </div>
      <div class="input-area">
        <div class="autocomplete" id="ac"></div>
        <div class="row" style="align-items:flex-end;gap:8px;">
          <textarea class="chat-input" id="chatInput"
            placeholder="Type a message or /command…" rows="1"
            onkeydown="handleKey(event)" oninput="handleInput(event)"></textarea>
          <button class="btn send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>

    <!-- Pipeline panel -->
    <div class="pipe-panel" id="pipePanel">
      <div style="color:var(--muted);text-align:center;padding:40px;">Loading pipelines…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// ─── State ───────────────────────────────────────────────────────────────────
const S = {
  base: '',
  user: 'alice',
  session: 'main',
  sessions: [],
  commands: [],
  pipelines: [],
  streaming: false,
  intrTid: null,
  acIdx: -1,
};

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  S.base = window.location.origin === 'null' ? 'http://localhost:8000' : window.location.origin;
  document.getElementById('apiBase').value = S.base;
  document.getElementById('userId').value = S.user;
  applySettings();
  loadHealth();
  setInterval(loadHealth, 15000);
});

function applySettings() {
  S.base = (document.getElementById('apiBase').value || '').replace(/\/$/, '') || 'http://localhost:8000';
  S.user = document.getElementById('userId').value.trim() || 'alice';
  loadSessions();
  loadCommands();
  loadPipelines();
  refreshSession(S.session);
}

// ─── Health ───────────────────────────────────────────────────────────────────
async function loadHealth() {
  try {
    const r = await fetch(`${S.base}/health`);
    const d = await r.json();
    const ok = d.status === 'ok' && d.postgres === 'ok';
    document.getElementById('healthDot').className = 'health-dot ' + (ok ? 'ok' : 'err');
    document.getElementById('healthTxt').textContent = ok ? 'Healthy' : `Degraded (pg:${d.postgres})`;
  } catch {
    document.getElementById('healthDot').className = 'health-dot err';
    document.getElementById('healthTxt').textContent = 'Offline';
  }
}

// ─── Sessions ─────────────────────────────────────────────────────────────────
async function loadSessions() {
  try {
    const r = await fetch(`${S.base}/threads/${enc(S.user)}`, { headers: xuid() });
    const d = await r.json();
    S.sessions = d.sessions || [];
    renderSessions();
  } catch {
    document.getElementById('sessionsList').innerHTML =
      '<div style="text-align:center;color:var(--error);font-size:12px;padding:12px;">Failed to load</div>';
  }
}

function renderSessions() {
  const el = document.getElementById('sessionsList');
  if (!S.sessions.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:12px;padding:14px;">No sessions yet</div>';
    return;
  }
  el.innerHTML = S.sessions.map(s => `
    <div class="sess-item ${s === S.session ? 'active' : ''}" onclick="refreshSession('${esc(s)}')">
      <span class="sess-name">${esc(s)}</span>
      <button class="sess-del" onclick="event.stopPropagation();delSession('${esc(s)}')" title="Delete">✕</button>
    </div>`).join('');
}

async function refreshSession(sid) {
  S.session = sid;
  document.getElementById('sessLabel').textContent = `${S.user} · ${sid}`;
  renderSessions();
  await loadMessages();
}

async function createSession() {
  const name = document.getElementById('newSess').value.trim();
  if (!name) return;
  if (!S.sessions.includes(name)) S.sessions = [...S.sessions, name];
  document.getElementById('newSess').value = '';
  await refreshSession(name);
  renderSessions();
}

async function delSession(sid) {
  if (!confirm(`Delete session "${sid}"?`)) return;
  try {
    await fetch(`${S.base}/threads/${enc(S.user)}/${enc(sid)}`, { method: 'DELETE', headers: xuid() });
    S.sessions = S.sessions.filter(s => s !== sid);
    if (S.session === sid) S.session = S.sessions[0] || 'main';
    renderSessions();
    await loadMessages();
  } catch(e) { alert('Delete failed: ' + e.message); }
}

// ─── Message history ──────────────────────────────────────────────────────────
async function loadMessages() {
  const el = document.getElementById('messages');
  el.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:13px;padding:18px;">Loading…</div>';
  try {
    const r = await fetch(`${S.base}/threads/${enc(S.user)}/${enc(S.session)}/messages`, { headers: xuid() });
    const d = await r.json();
    el.innerHTML = '';
    if (!d.messages?.length) {
      el.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:13px;padding:40px;">No messages yet — say hello!</div>';
      return;
    }
    for (const m of d.messages) addHistoryMsg(m.type, m.content, m.name);
    scrollBot();
  } catch {
    el.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:13px;padding:40px;">Start a new conversation!</div>';
  }
}

function addHistoryMsg(type, content, name) {
  const el = document.getElementById('messages');
  const node = document.createElement('div');
  if (type === 'human') {
    node.className = 'msg msg-user';
    node.innerHTML = `<div class="msg-label">You</div><div class="bubble">${esc(content)}</div>`;
  } else if (type === 'ai') {
    node.className = 'msg msg-ai';
    node.innerHTML = `<div class="msg-label">Assistant</div><div class="bubble md">${md(content)}</div>`;
  } else if (type === 'tool') {
    node.className = 'tool-block result-block';
    const short = truncate(content, 400);
    node.innerHTML = `<div class="tb-header"><span class="badge badge-result">result</span><span class="tool-name">${esc(name||'tool')}</span></div><div class="tool-content">${esc(short)}</div>`;
  } else {
    node.className = 'msg msg-center';
    node.innerHTML = `<div style="font-size:11px;color:var(--muted);">[${type}] ${esc(content||'')}</div>`;
  }
  el.appendChild(node);
}

// ─── Send + SSE ───────────────────────────────────────────────────────────────
async function sendMessage() {
  const inp = document.getElementById('chatInput');
  const msg = inp.value.trim();
  if (!msg || S.streaming) return;
  hideAC();
  addHistoryMsg('human', msg);
  inp.value = ''; inp.style.height = 'auto';
  showTyping();
  setDisabled(true);
  try {
    const resp = await fetch(`${S.base}/chat/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...xuid() },
      body: JSON.stringify({ session_id: S.session, message: msg }),
    });
    if (!resp.ok) { const t = await resp.text(); throw new Error(`HTTP ${resp.status}: ${t}`); }
    await readSSE(resp, onEvent);
  } catch(e) {
    removeTyping();
    appendErr('Stream error: ' + e.message);
  } finally { setDisabled(false); }
}

async function readSSE(resp, handler) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop() ?? '';
    for (const chunk of parts) {
      if (!chunk.trim()) continue;
      let ev = 'message', data = '';
      for (const line of chunk.split('\n')) {
        if (line.startsWith('event: ')) ev = line.slice(7).trim();
        else if (line.startsWith('data: ')) data = line.slice(6);
      }
      handler(ev, data);
    }
  }
  // flush remainder
  if (buf.trim()) {
    let ev = 'message', data = '';
    for (const line of buf.split('\n')) {
      if (line.startsWith('event: ')) ev = line.slice(7).trim();
      else if (line.startsWith('data: ')) data = line.slice(6);
    }
    if (data) handler(ev, data);
  }
}

function onEvent(type, raw) {
  removeTyping();
  const msgs = document.getElementById('messages');
  const payload = tryJSON(raw);

  if (type === 'message') {
    if (!payload) return;
    if (payload.type === 'ai') {
      if (payload.content?.trim()) {
        const n = document.createElement('div');
        n.className = 'msg msg-ai';
        n.innerHTML = `<div class="msg-label">Assistant</div><div class="bubble md">${md(payload.content)}</div>`;
        msgs.appendChild(n);
      }
      for (const tc of payload.tool_calls || []) {
        const n = document.createElement('div');
        n.className = 'tool-block';
        n.innerHTML = `<div class="tb-header"><span class="badge badge-call">calling</span><span class="tool-name">${esc(tc.tool)}</span></div><div class="tool-content">${esc(JSON.stringify(tc.args, null, 2))}</div>`;
        msgs.appendChild(n);
      }
    }
  } else if (type === 'tool_result') {
    if (!payload) return;
    const n = document.createElement('div');
    n.className = 'tool-block result-block';
    n.innerHTML = `<div class="tb-header"><span class="badge badge-result">result</span><span class="tool-name">${esc(payload.tool||'tool')}</span></div><div class="tool-content">${esc(truncate(payload.content||'', 600))}</div>`;
    msgs.appendChild(n);
  } else if (type === 'interrupt') {
    const detail = payload ?? { raw };
    const tid = `${S.user}:${S.session}`;
    const n = document.createElement('div');
    n.className = 'intr-block'; n.id = 'intrBlock';
    n.innerHTML = `
      <div class="intr-title">⚠️ Approval Required</div>
      <div class="intr-detail">${esc(JSON.stringify(detail, null, 2))}</div>
      <div class="intr-actions">
        <button class="btn btn-sm" onclick="doResume('approve')">✓ Approve</button>
        <button class="btn btn-sm btn-red" onclick="doResume('deny')">✗ Deny</button>
      </div>`;
    S.intrTid = tid;
    msgs.appendChild(n);
  } else if (type === 'done') {
    const n = document.createElement('div');
    n.className = 'done-pill'; n.textContent = '✓ Done';
    msgs.appendChild(n);
  } else if (type === 'error') {
    appendErr('Error: ' + (payload?.message || raw));
  }
  scrollBot();
}

// ─── HITL Resume ─────────────────────────────────────────────────────────────
async function doResume(decision) {
  const block = document.getElementById('intrBlock');
  if (!block || !S.intrTid) return;
  block.querySelectorAll('button').forEach(b => b.disabled = true);
  showTyping();
  setDisabled(true);
  try {
    const resp = await fetch(`${S.base}/threads/${enc(S.intrTid)}/runs/resume`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...xuid() },
      body: JSON.stringify({ resume: decision }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    block.remove(); S.intrTid = null;
    await readSSE(resp, onEvent);
  } catch(e) {
    removeTyping();
    appendErr('Resume error: ' + e.message);
  } finally { setDisabled(false); }
}

// ─── Commands ─────────────────────────────────────────────────────────────────
async function loadCommands() {
  try {
    const r = await fetch(`${S.base}/commands`);
    const d = await r.json();
    S.commands = d.commands || [];
    const el = document.getElementById('cmdRef');
    el.innerHTML = S.commands.map(c =>
      `<div><span>/${esc(c.name)}</span> — ${esc(c.description)}</div>`).join('');
  } catch { S.commands = []; }
}

// ─── Autocomplete ─────────────────────────────────────────────────────────────
function handleInput(e) {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 130) + 'px';
  const val = e.target.value;
  if (val.startsWith('/') && !val.includes(' ')) {
    const q = val.slice(1).toLowerCase();
    showAC(S.commands.filter(c => c.name.startsWith(q)));
  } else { hideAC(); }
}

function showAC(cmds) {
  const el = document.getElementById('ac');
  if (!cmds.length) { hideAC(); return; }
  el.innerHTML = cmds.map((c, i) => `
    <div class="ac-item ${i === S.acIdx ? 'sel' : ''}" onclick="pickCmd('${esc(c.name)}')">
      <span class="ac-cmd">/${esc(c.name)}</span>
      <span class="ac-desc">${esc(c.description)}</span>
    </div>`).join('');
  el.classList.add('show');
}

function hideAC() { document.getElementById('ac').classList.remove('show'); S.acIdx = -1; }

function pickCmd(name) {
  document.getElementById('chatInput').value = `/${name} `;
  hideAC();
  document.getElementById('chatInput').focus();
}

function handleKey(e) {
  const ac = document.getElementById('ac');
  const visible = ac.classList.contains('show');
  const items = ac.querySelectorAll('.ac-item');
  const filtered = () => {
    const q = document.getElementById('chatInput').value.slice(1).toLowerCase();
    return S.commands.filter(c => c.name.startsWith(q));
  };
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (visible && S.acIdx >= 0) {
      const match = filtered()[S.acIdx];
      if (match) { pickCmd(match.name); return; }
    }
    sendMessage();
  } else if (e.key === 'ArrowDown' && visible) {
    e.preventDefault(); S.acIdx = Math.min(S.acIdx + 1, items.length - 1); showAC(filtered());
  } else if (e.key === 'ArrowUp' && visible) {
    e.preventDefault(); S.acIdx = Math.max(S.acIdx - 1, 0); showAC(filtered());
  } else if (e.key === 'Escape') { hideAC(); }
}

// ─── Pipelines ────────────────────────────────────────────────────────────────
async function loadPipelines() {
  try {
    const r = await fetch(`${S.base}/pipelines`);
    const d = await r.json();
    S.pipelines = d.pipelines || [];
    renderPipelines();
  } catch { S.pipelines = []; }
}

function renderPipelines() {
  const panel = document.getElementById('pipePanel');
  if (!S.pipelines.length) {
    panel.innerHTML = '<div style="color:var(--muted);text-align:center;padding:40px;">No pipelines registered.</div>';
    return;
  }
  panel.innerHTML = S.pipelines.map(p => `
    <div class="pipe-card">
      <div class="pipe-title">⚡ ${esc(p.name)}</div>
      <div class="pipe-desc">${esc(p.description)}</div>
      ${buildForm(p)}
      <button class="btn btn-sm" onclick="runPipeline('${esc(p.name)}')">▶ Run</button>
      <div class="pipe-result" id="pr-${esc(p.name)}"></div>
    </div>`).join('');
}

function buildForm(p) {
  const props = p.input_schema?.properties || {};
  return Object.entries(props).map(([k, s]) => {
    const big = s.type === 'string' && (!s.maxLength || s.maxLength > 100 || k === 'text');
    if (big) {
      return `<label class="form-label">${esc(k)}</label>
              <textarea class="form-area" id="pf-${esc(p.name)}-${esc(k)}" rows="${k==='text'?6:3}"
                placeholder="${esc(s.description||k)}"></textarea>`;
    }
    return `<label class="form-label">${esc(k)}</label>
            <input class="input-sm" style="margin-bottom:10px;" id="pf-${esc(p.name)}-${esc(k)}"
              value="${esc(s.default||'')}" placeholder="${esc(s.description||k)}">`;
  }).join('');
}

async function runPipeline(name) {
  const p = S.pipelines.find(x => x.name === name);
  if (!p) return;
  const resEl = document.getElementById(`pr-${name}`);
  resEl.textContent = 'Running…'; resEl.classList.add('show');
  const data = {};
  for (const k of Object.keys(p.input_schema?.properties || {})) {
    const f = document.getElementById(`pf-${name}-${k}`);
    if (f?.value) data[k] = f.value;
  }
  try {
    const r = await fetch(`${S.base}/api/${name}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
    });
    const result = await r.json();
    resEl.textContent = JSON.stringify(result, null, 2);
  } catch(e) { resEl.textContent = 'Error: ' + e.message; }
}

// ─── Tabs ─────────────────────────────────────────────────────────────────────
function switchTab(t) {
  document.getElementById('chatPanel').style.display = t === 'chat' ? 'flex' : 'none';
  document.getElementById('pipePanel').className = 'pipe-panel' + (t === 'pipe' ? ' show' : '');
  document.getElementById('tabChat').className = 'tab' + (t === 'chat' ? ' active' : '');
  document.getElementById('tabPipe').className = 'tab' + (t === 'pipe' ? ' active' : '');
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function showTyping() {
  removeTyping();
  const n = document.createElement('div');
  n.className = 'typing'; n.id = 'typing';
  n.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  document.getElementById('messages').appendChild(n);
  scrollBot();
}
function removeTyping() { document.getElementById('typing')?.remove(); }
function appendErr(msg) {
  const n = document.createElement('div'); n.className = 'err-block'; n.textContent = msg;
  document.getElementById('messages').appendChild(n); scrollBot();
}
function setDisabled(v) {
  S.streaming = v;
  document.getElementById('sendBtn').disabled = v;
  document.getElementById('chatInput').disabled = v;
  document.getElementById('sendBtn').textContent = v ? '⏳' : '➤';
}
function scrollBot() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}
function md(text) {
  if (!text) return '';
  if (typeof marked !== 'undefined') return marked.parse(text);
  return esc(text);
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function enc(s) { return encodeURIComponent(s); }
function xuid() { return { 'X-User-Id': S.user }; }
function tryJSON(s) { try { return JSON.parse(s); } catch { return null; } }
function truncate(s, n) { return s.length > n ? s.slice(0, n) + '\n…(truncated)' : s; }
</script>
